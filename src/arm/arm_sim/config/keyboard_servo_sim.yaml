# Parameters for keyboard_servo_node when teleoperating the Gazebo sim:
#
#   ros2 run arm_teleop keyboard_servo_node --ros-args \
#     --params-file $(ros2 pkg prefix arm_sim)/share/arm_sim/config/keyboard_servo_sim.yaml
#
# use_sim_time makes the node follow Gazebo's /clock (required so its
# command stamps match what MoveIt Servo expects in sim). The speeds are
# raised above the conservative hardware defaults (0.1 / 0.3) — fine in
# simulation, deliberately NOT the node's defaults so the real arm keeps
# the slower values.
keyboard_servo_node:
  ros__parameters:
    use_sim_time: true
    linear_speed: 0.25
    angular_speed: 0.75
