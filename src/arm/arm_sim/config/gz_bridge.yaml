# Arm wrist camera only. /clock is bridged by whichever entry point owns
# Gazebo (arm_gz.launch.py, or indomitus_bringup's sim_rover_arm via the
# rover bridge), so this file can be reused by both without a second /clock.
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/arm_camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/arm_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS