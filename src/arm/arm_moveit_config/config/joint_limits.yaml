# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Specific joint properties can be changed with the keys
# [max_position, min_position, max_velocity, max_acceleration, max_jerk].
# Joint limits can be turned off with
# [has_velocity_limits, has_acceleration_limits, has_jerk_limits].
# max_jerk is used by Ruckig smoothing (AddRuckigTrajectorySmoothing).
#
# min_position/max_position below are a MoveIt-planning-only override — they
# shrink the space OMPL samples in without touching arm_macro.xacro's URDF
# <limit> (+-4*pi on every joint, deliberately wide so real-hardware teleop
# can be wound past +-pi). Left at the URDF's full +-4*pi, RRTConnect's
# uniform random sampling was failing outright ("Unable to solve the
# planning problem" / "Catastrophic failure") on ordinary goals like
# drill_home, because the search volume across all 6 joints together is
# astronomically larger than the actual reachable/collision-free corridor.
# +-2*pi here keeps 2x headroom over every joint value any saved pose
# actually uses today (poses.json's max is +-3.3276 rad, on
# arm_forearm_wrist_1_joint/arm_wrist_1_wrist_2_joint) while cutting OMPL's
# search volume 64x (2x per joint, 6 joints) vs the URDF's +-4*pi. If a
# future taught pose needs a joint value beyond +-2*pi, raise ONLY that
# joint's bound here — don't blanket-raise all six back toward +-4*pi, that
# reintroduces this same planning failure.
joint_limits:
  arm_base_shoulder_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_jerk_limits: true
    max_jerk: 5.0
    min_position: -6.283185
    max_position: 6.283185
  arm_forearm_wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.5
    has_jerk_limits: true
    max_jerk: 12.5
    min_position: -6.283185
    max_position: 6.283185
  arm_mount_base_joint:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.5
    has_jerk_limits: true
    max_jerk: 7.5
    min_position: -6.283185
    max_position: 6.283185
  arm_shoulder_forearm_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_jerk_limits: true
    max_jerk: 5.0
    min_position: -6.283185
    max_position: 6.283185
  arm_wrist_1_wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.5
    has_jerk_limits: true
    max_jerk: 12.5
    min_position: -6.283185
    max_position: 6.283185
  arm_wrist_2_end_effector_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.5
    has_jerk_limits: true
    max_jerk: 12.5
    min_position: -6.283185
    max_position: 6.283185
