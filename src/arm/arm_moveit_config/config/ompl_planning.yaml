# OMPL planning pipeline for indomitus_arm (MoveIt 2 Humble).
#
# No top-level "ompl:" wrapper — moveit_configs_utils' MoveItConfigsBuilder
# already scopes this whole file's content under the pipeline's own name
# ("ompl") when passing it to move_group. Nesting it again here (the
# previous version of this file did) produces a live parameter at
# ompl.ompl.planning_plugin instead of ompl.planning_plugin — move_group
# then can't find the plugin name where it looks, falls back to
# enumerating every pluginlib-registered planner manager class ("Multiple
# planning plugins available"), and silently picks CHOMP instead of OMPL.
# CHOMP only accepts joint-space goals, so any Cartesian pose-constraint
# request (e.g. panel_align_node's) is rejected outright with
# MoveItErrorCodes.INVALID_GOAL_CONSTRAINTS before planning even starts.
# Confirmed against moveit_configs_utils' own bundled default
# ompl_planning.yaml, which is flat the same way.
#
# velocity/acceleration limits — already respects joint_limits.yaml on its
# own. AddRuckigTrajectorySmoothing (jerk-limited reshaping on top of TOTG)
# is dropped: confirmed live it fails both on the real arm and on
# panel_align_node's short align motions (moveit_trajectory_processing.
# ruckig_traj_smoothing: "Ruckig error: -100" ==
# ruckig::Result::ErrorInvalidInput), and MoveIt's failure handling for that
# adapter leaves the trajectory with two leading points both at
# time_from_start=0 — indomitus_arm_controller's FollowJointTrajectory
# action server then rejects the whole goal outright ("Time between points
# 0 and 1 is not strictly increasing"), or move_group just reports
# "executed" while the arm never moves. TOTG alone is standard and safe;
# only the jerk-limiting refinement is lost, not velocity/acceleration
# safety margins.
planning_plugin: ompl_interface/OMPLPlanner
request_adapters: >-
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/AddTimeOptimalParameterization
start_state_max_bounds_error: 0.1

planner_configs:
  # BIT* (Batch Informed Trees) — RRTConnect is feasibility-only (first
  # path found, no preference for a direct route, hence twisted large
  # joint-space jumps like sampling_home -> drill_home). RRTstar fixes
  # that in principle (asymptotically optimal) but converges slowly —
  # random sampling, one point at a time — so within a fixed time budget
  # it often hasn't straightened out much either. BIT* samples in
  # heuristically-ordered batches from an informed set around the
  # current best solution, so it converges toward a short/direct path
  # much faster for the same allowed_planning_time (10s, set in
  # _execute_move_group_constraints) — a meaningfully better use of that
  # budget than RRTstar for this same 6-DOF joint-space problem.
  # RRTConnect intentionally not listed here so its effect stays isolated.
  BITstarkConfigDefault:
    type: geometric::BITstar

indomitus_arm:
  planner_configs:
    - BITstarkConfigDefault
