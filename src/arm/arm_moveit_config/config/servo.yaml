moveit_servo:
  ros__parameters:
    move_group_name: indomitus_arm

    # Twist is applied in the mount / planning frame so stick XYZ moves the
    # EEF in world/mount axes. Teleop rotates EEF roll/pitch/yaw into this
    # frame before publish.
    robot_link_command_frame: arm_mount_link

    ee_frame_name: arm_tcp_link

    planning_frame: arm_mount_link

    cartesian_command_in_topic: /servo_node/delta_twist_cmds

    joint_command_in_topic: /servo_node/delta_joint_cmds

    joint_topic: /joint_states

    status_topic: /servo_node/status

    # Stream joint position setpoints (not short JointTrajectory goals).
    # Avoids JTC preempt/restart every publish_period — the main teleop jerk source.
    command_out_topic: /indomitus_arm_forward_position_controller/commands

    # speed_units: this multiplies the teleop twist. 0.2 made W's per-cycle
    # joint step (~0.0006 rad) sit on the MIT position deadband (0.0005 rad),
    # so +X never accumulated while gravity-assisted -X (S) still moved.
    scale:
      linear: 1.0
      rotational: 1.0
      joint: 1.0

    # Servo re-anchors to the measured pose every cycle, so the per-cycle step
    # (velocity ceiling * publish_period) is all the position error the MIT loop
    # ever sees. Below ~0.02 rad that error cannot produce enough torque to break
    # static friction, the joint never moves, and the command never accumulates.
    override_velocity_scaling_factor: 1.0

    command_in_type: speed_units
    command_out_type: std_msgs/Float64MultiArray
    # Step per cycle ≈ joint_vel * publish_period. 33 Hz keeps ~0.02 rad/cycle
    # at 0.7 rad/s so +X (W) still overcomes MIT stiction.
    publish_period: 0.03

    publish_joint_positions: true
    # Float64MultiArray streaming is position-only (JointGroupPositionController).
    publish_joint_velocities: false
    publish_joint_accelerations: false

    incoming_command_timeout: 0.1
    num_outgoing_halt_msgs_to_publish: 4
    halt_all_joints_in_joint_mode: true
    halt_all_joints_in_cartesian_mode: true

    # Must be false at process start. ros2 param set does not stop Servo's
    # collision thread. From home, that thread zeros +X (W) after ~80 ms
    # while -X (S) still moves. Plan/Execute in move_group still checks
    # collisions. Rebuild + restart demo for this to take effect.
    check_collisions: false
    collision_check_rate: 10.0
    self_collision_proximity_threshold: 0.01
    scene_collision_proximity_threshold: 0.02

    # Home wrist is near 0; default 17/30 scaled +X to a halt. Same idea as
    # NHWA SpaceMouse teleop: do not decelerate for Jacobian condition number.
    lower_singularity_threshold: 10000.0
    hard_stop_singularity_threshold: 100000.0
    leaving_singularity_threshold_multiplier: 2.0

    joint_limit_margin: 0.1

    is_primary_planning_scene_monitor: false
    monitored_planning_scene_topic: /monitored_planning_scene