chassis_driver:
  ros__parameters:
    # Steadywin steer motor ESC IDs [FL, FR, RL, RR]
    steer_ids: [11, 13, 15, 17]
    # Damiao drive motor ESC IDs [FL, FR, RL, RR]
    drive_ids: [10, 12, 14, 16]

    # Damiao MIT feedback fixed-point decoding ranges (must match motor registers 21/22/23)
    drive_pmax: 12.5    # rad  — register 21 (PMAX)
    drive_vmax: 50.0    # rad/s — register 22 (VMAX)
    drive_tmax: 20.0    # Nm   — register 23 (TMAX)

    # Damiao MIT feedback CAN ID (MST_ID register 7, default 0x000)
    mst_id: 0

    # Joint names for /joint_states — must match URDF joint names [FL, FR, RL, RR]
    steer_joint_names:
      - fl_wheel_mount_joint
      - fr_wheel_mount_joint
      - bl_wheel_mount_joint
      - br_wheel_mount_joint
    drive_joint_names:
      - fl_wheel_joint
      - fr_wheel_joint
      - bl_wheel_joint
      - br_wheel_joint
