aruco_tracker:
  ros__parameters:
    cam_base_topic: /camera/image_raw 
    marker_size: 0.05
    # Competition uses the original ArUco dictionary, not 4X4_50 — see
    # panel_description/meshes/aruco_tags/README.md for the matching
    # marker PNGs (IDs 11,13,14,15, generated with
    # cv2.aruco.DICT_ARUCO_ORIGINAL).
    marker_dict: ARUCO_ORIGINAL
    publish_tf: true 

