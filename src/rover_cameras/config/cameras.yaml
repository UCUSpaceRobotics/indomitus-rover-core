# The cameras this rover can carry. cameras.launch.py starts one camera_node per entry;
# a camera that is not plugged in just waits for its device, so this lists every camera
# that may be mounted, not the ones mounted today.
#
# Ported from indomitus-ground-station/cameras/cameras.yaml: same names, devices (udev
# symlinks — /dev/videoN numbers move on replug) and ports, so GS UI tiles keep working:
#   http://10.42.0.1:<port>/<name>?action=stream
# Check a camera's real modes with `v4l2-ctl -d <device> --list-formats-ext`; a mode it
# does not offer is snapped to the nearest one and logged.
#
# ROS: /rover/cameras/<name with - as _>/image_raw and .../camera_info, for nodes on the
# rover only (video to the GS goes over HTTP, never DDS).
#
# Keys (any of them also under `defaults:`):
#   device         udev symlink, or `videotestsrc` for a test pattern
#   port           HTTP port of the MJPEG stream; 0 = no HTTP
#   format         V4L2 FourCC: YUYV, MJPG, UYVY, GREY, NV12
#   res, fps       capture mode
#   quality        stream JPEG quality (ignored for MJPG cameras: passed through as is)
#   save_quality   JPEG quality of dataset frames (/capture, /record)
#   jpeg_encoder   GStreamer JPEG encoder element (jpegenc = CPU; nvjpegenc when available)
#   ros_fps        rate of the ROS topic; 0 = every captured frame
#   ros_res        size of the ROS topic, WxH; empty = capture size
#   ros_encoding   rgb8, bgr8 or mono8
#   frame_id       default <ros name>_optical_frame
#   calibration    camera_calibration YAML, relative to config/calibration/ or absolute;
#                  default config/calibration/<name>.yaml if it exists

defaults:
  format: YUYV
  res: 960x600
  fps: 15
  quality: 60
  save_quality: 95
  jpeg_encoder: jpegenc
  ros_fps: 5
  ros_res: ''
  ros_encoding: rgb8
  save_dir: ~/dataset

cameras:
  # Arducam B0495, YUYV only:
  #   USB 3.0: 1920x1200 @50/30/15, 960x600 @80/60/30/15
  #   USB 2.0: 960x600 @10 only
  arducam-mast:
    device: /dev/arducam-mast
    port: 8091   # http://10.42.0.1:8091/arducam-mast?action=stream

  arducam-front:
    device: /dev/arducam-front
    port: 8092   # http://10.42.0.1:8092/arducam-front?action=stream
    quality: 5

  arducam-front-bottom:
    device: /dev/arducam-front-bottom
    port: 8093   # http://10.42.0.1:8093/arducam-front-bottom?action=stream

  # MJPG: 640x480 .. 2592x1944 @30; YUYV: 640x480 @30, larger ones slower
  arm-camera:
    device: /dev/arm-camera
    port: 8095   # http://10.42.0.1:8095/arm-camera?action=stream
    format: MJPG
    res: 640x480
    fps: 30
    quality: 30

  # MJPG: up to 1920x1080 @30, 1280x720 and smaller @60
  thermal-camera-front:
    device: /dev/thermal-camera
    port: 8097   # http://10.42.0.1:8097/thermal-camera-front?action=stream
    format: MJPG
    res: 640x480
    fps: 10
    quality: 40
