# rover_navigation/config/nav2_params.yaml

# ============================================================
# BT NAVIGATOR
# ============================================================

/**/bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 100
    default_server_timeout: 20
    transform_tolerance: 2.0
    # BT XML paths are injected at launch time.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    navigators:
      - navigate_to_pose
      - navigate_through_poses
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_recovery_node_bt_node
      - nav2_remove_passed_goals_action_bt_node
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ============================================================
# CONTROLLER SERVER
# ============================================================

/**/controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    transform_tolerance: 2.0
    current_goal_checker: "general_goal_checker"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "general_goal_checker"
    controller_plugins:
      - FollowPath

    # --- Progress checker ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    # --- Goal checker ---
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # --- MPPI controller ---
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 30
      model_dt: 0.1
      batch_size: 800
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.02
      wz_std: 0.25
      vx_max:  0.5
      vx_min: -0.2
      vy_max:  0.05
      vy_min: -0.05
      wz_max:  0.7
      # Acceleration limits.
      ax_max:  0.6
      ax_min: -0.6
      ay_max:  0.5
      az_max:  1.0
      prune_distance: 3.0
      transform_tolerance: 2.0
      temperature: 0.5
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

      # --- Critics ---
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.0

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        critical_cost: 200.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 1
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 8
        threshold_to_consider: 2.0

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0
        offset_from_furthest: 6
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.5
        forward_preference: true

# ============================================================
# PLANNER SERVER
# ============================================================

/**/planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    transform_tolerance: 2.0
    planner_plugins:
      - GridBased
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# ============================================================
# WAYPOINT FOLLOWER
# ============================================================

/**/waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      time_to_wait: 1.0

# ============================================================
# BEHAVIOUR SERVER
# ============================================================

/**/behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      x_vel_accel_limit: 0.5
      x_vel_decel_limit: -0.5
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      x_vel_accel_limit: 0.5
      x_vel_decel_limit: -0.5
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.5
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

# ============================================================
# COSTMAPS
# ============================================================

/**/local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      transform_tolerance: 2.0
      footprint: "[[0.50, 0.45], [0.50, -0.45], [-0.50, -0.45], [-0.50, 0.45]]"
      footprint_padding: 0.05
      plugins:
        - voxel_layer
        - slope_layer
        - inflation_layer
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 2
        observation_sources: scan
        scan:
          topic: rplidar/scan_filtered
          sensor_frame: laser_link
          max_obstacle_height: 2.0
          min_obstacle_height: 0.3
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.45
          obstacle_max_range: 4.0
          obstacle_min_range: 0.45
      slope_layer:
        plugin: "rover_costmap_plugins::SlopeLayer"
        enabled: true
        cloud_topic: "zed2i/points"
        base_frame: "base_footprint"
        grid_resolution: 0.25
        grid_range: 4.0
        min_height: -0.30
        max_height: 2.40
        min_points_per_cell: 7
        traversable_slope_deg: 18.0
        lethal_slope_deg: 30.0
        roughness_std_thresh: 0.045
        roughness_range_coeff: 0.015
        self_filter_margin: 0.10
        roughness_saturation_mult: 4.0
        roughness_lethal: false
        # Steep neighbours a lethal cell needs to be trusted. 2 keeps a rock
        # covering 2x2 cells and drops isolated noise. 0 disables it.
        lethal_min_support: 2
        # Radius around the rover that is never painted, since stereo is
        # noisiest there and it cannot re-check ground it stands on.
        robot_clear_radius: 1.0
        # Min spread (m^2) for a plane fit. Points on a line give a normal
        # pointing anywhere, which reads as false slope.
        min_plane_spread: 1.0e-4
        # Off here: MPPI scores unknown cells at critical cost, so the rover
        # would refuse to drive into ground it has not seen yet.
        mark_unobserved_unknown: false
        # Gap after which the camera counts as dead. Keep it above the slowest
        # normal frame gap, or the layer flaps in and out of use.
        cloud_timeout: 5.0
        # Covers cloud latency (~2 s in sim). Real hardware needs 0.3-0.5.
        tf_tolerance: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 35.0
        inflation_radius: 0.85
      always_send_full_costmap: false

/**/global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 2.0
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.1
      footprint: "[[0.50, 0.45], [0.50, -0.45], [-0.50, -0.45], [-0.50, 0.45]]"
      footprint_padding: 0.15
      track_unknown_space: true
      plugins:
        - obstacle_layer
        - slope_layer
        - inflation_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Overwrite lets lidar clear stale obstacles. The slope layer runs
        # after and repaints, so its bounds must cover the range below.
        combination_method: 0
        observation_sources: scan
        scan:
          topic: rplidar/scan_filtered
          sensor_frame: laser_link
          max_obstacle_height: 2.0
          min_obstacle_height: 0.2
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1
          observation_persistence: 0.5
      slope_layer:
        plugin: "rover_costmap_plugins::SlopeLayer"
        enabled: true
        # Terrain is remembered, so a rock stays on the map when the camera
        # turns away. A costmap clear wipes it.
        persist: true
        # Memory half-size (m) around the rover's first pose. Terrain outside
        # it is dropped with a warning.
        persist_half_extent: 50.0
        # Area repainted each cycle. Keep >= the obstacle layer's
        # raytrace_max_range, or its clearing wins over remembered terrain.
        persist_update_range: 6.0
        cloud_topic: "zed2i/points"
        base_frame: "base_footprint"
        grid_resolution: 0.25
        grid_range: 4.0
        min_height: -0.30
        max_height: 2.40
        min_points_per_cell: 7
        traversable_slope_deg: 18.0
        lethal_slope_deg: 30.0
        roughness_std_thresh: 0.045
        roughness_range_coeff: 0.015
        self_filter_margin: 0.10
        roughness_saturation_mult: 4.0
        roughness_lethal: false
        # Steep neighbours a lethal cell needs to be trusted. 2 keeps a rock
        # covering 2x2 cells and drops isolated noise. 0 disables it.
        lethal_min_support: 2
        # Radius around the rover that is never painted, since stereo is
        # noisiest there and it cannot re-check ground it stands on.
        robot_clear_radius: 1.0
        # Min spread (m^2) for a plane fit. Points on a line give a normal
        # pointing anywhere, which reads as false slope.
        min_plane_spread: 1.0e-4
        # Unseen cells are written as unknown. Needs track_unknown_space.
        mark_unobserved_unknown: true
        # Gap after which the camera counts as dead. Keep it above the slowest
        # normal frame gap, or the layer flaps in and out of use.
        cloud_timeout: 5.0
        # Covers cloud latency (~2 s in sim). Real hardware needs 0.3-0.5.
        tf_tolerance: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 35.0
        inflation_radius: 0.8
      always_send_full_costmap: false

# ============================================================
# LIFECYCLE MANAGERS
# ============================================================

/**/lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - local_costmap
      - global_costmap