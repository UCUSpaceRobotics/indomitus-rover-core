amcl:
  ros__parameters:
    use_sim_time: True


bt_navigator:
  ros__parameters:
    use_sim_time: True

    # Frame configuration
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom

    # BT execution settings
    bt_loop_duration: 10
    default_server_timeout: 20

    # Custom BT XML files loaded by the application
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

    # Behavior Tree plugins
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_rate_controller_bt_node


controller_server:
  ros__parameters:
    use_sim_time: True

    # Controller update rate
    controller_frequency: 20.0

    # Velocity thresholds
    min_x_velocity_threshold:     0.001
    min_y_velocity_threshold:     0.001
    min_theta_velocity_threshold: 0.001

    # Navigation failure tolerance
    failure_tolerance: 1.5

    # Plugins
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    # Goal checker
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True

      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # Local planner
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: True

      # Velocity limits
      min_vel_x:     -0.5
      max_vel_x:      0.5
      min_vel_y:     -0.5
      max_vel_y:      0.5
      max_vel_theta:  0.5

      min_speed_xy:    0.0
      max_speed_xy:    0.5
      min_speed_theta: 0.0

      # Acceleration limits
      acc_lim_x:     1.5
      acc_lim_y:     1.5
      acc_lim_theta: 2.0

      decel_lim_x:     -1.5
      decel_lim_y:     -1.5
      decel_lim_theta: -2.0

      # Trajectory generation
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"

      vx_samples:     20
      vy_samples:     20
      vtheta_samples: 20

      # Trajectory critics
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
        - Twirling

      BaseObstacle.scale: 0.02

      PathAlign.scale: 32.0
      PathDist.scale:  32.0

      GoalAlign.scale: 24.0
      GoalDist.scale:  24.0

      RotateToGoal.scale: 32.0
      Oscillation.scale:  0.01
      Twirling.scale:     1.0


planner_server:
  ros__parameters:
    use_sim_time: True

    # Expected planning rate
    expected_planner_frequency: 20.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

      tolerance: 0.5
      use_astar: false
      allow_unknown: true


waypoint_follower:
  ros__parameters:
    use_sim_time: True

    # Waypoint execution
    loop_rate: 20
    stop_on_failure: True

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      time_to_wait: 1.0


behavior_server:
  ros__parameters:
    use_sim_time: True

    # Recovery behaviors
    behavior_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    wait:
      plugin: "nav2_behaviors/Wait"

    # Frame configuration
    global_frame: odom
    robot_base_frame: base_link

    transform_timeout: 0.1


lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True

    # Automatically bring up navigation stack
    autostart: True

    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
      - waypoint_follower