/**/arducam_node:
  ros__parameters:
    # --- Software Parameters ---
    image_size: [1920, 1200]                  # Resolution requested from the camera [width, height]
    pixel_format: "YUYV"                      # Raw pixel format requested from the V4L2 hardware
    output_encoding: "rgb8"                   # Image encoding published to the ROS /image_raw topic

    # --- Hardware Parameters ---
    brightness: 0                             # Adjusts the hardware image brightness level
    contrast: 10                              # Adjusts the hardware image contrast level
    saturation: 10                            # Adjusts the hardware color saturation intensity
    gain: 168                                 # Adjusts the hardware sensor gain (ISO equivalent) for low light
    white_balance_automatic: true             # Toggles auto white balance (true = enabled, false = disabled)
    white_balance_temperature: 4500           # Manual white balance in Kelvin (requires white_balance_automatic: 0)
    auto_exposure: 0                          # Toggles automatic exposure calculation (values depend on UVC spec, usually 3=auto, 1=manual)
    exposure_time_absolute: 5                 # Manual exposure time (requires auto_exposure to be set to manual mode)
    power_line_frequency: 0                   # Anti-flicker setting for indoor lighting (0 = disabled, 1 = 50Hz, 2 = 60Hz)

/**/throttle_raw:
  ros__parameters:
    msgs_per_sec: 30.0                        # Default rate limit for the throttled image_raw output topic

/**/throttle_compressed:
  ros__parameters:
    msgs_per_sec: 30.0                        # Default rate limit for the throttled image_raw/compressed output topic