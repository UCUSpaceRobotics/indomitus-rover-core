---
# rgb mode-specific overrides only - the shared general/video/sensors block lives in
# zed2i_common.yaml and is merged with this file at launch time by zed2i.launch.py.
/**/zed_node:
  ros__parameters:
    region_of_interest:
      automatic_roi: false # Enable the automatic ROI generation to automatically detect part of the robot in the FoV and remove them from the processing. Note: if enabled the value of `manual_polygon` is ignored

    depth:
      depth_mode: 'NONE' # Matches the ZED SDK setting: 'NONE', 'NEURAL_LIGHT', 'NEURAL', 'NEURAL_PLUS' - Note: if 'NONE' all the modules that requires depth extraction are disabled by default (Pos. Tracking, Obj. Detection, Mapping, ...). RGB mode only needs images, so depth extraction is skipped entirely to save compute.

    pos_tracking:
      pos_tracking_enabled: false # True to enable positional tracking from start. RGB mode does not publish VIO, so tracking stays off to save compute.

    debug:
      sdk_verbose: 1 # Set the verbose level of the ZED SDK
