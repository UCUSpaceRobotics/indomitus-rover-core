# rover_sensors/config/scan_filter.yaml

/**/laser_filter_node:
  ros__parameters:
    filter1:
      name: range_filter
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.25
        upper_threshold: 18.0
        lower_replacement_value: .nan
        upper_replacement_value: .nan

    filter2:
      name: self_filter_towerlight_left
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: 2.199   # ~126 deg
        upper_angle: 2.583   # ~148 deg

    filter3:
      name: self_filter_towerlight_right
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: -2.583  # ~-148 deg
        upper_angle: -2.199  # ~-126 deg

    filter4:
      name: self_filter_mast
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: 2.932  # ~168 deg
        upper_angle: -2.932  # ~-168 deg
        wrap_angle: true

    filter5:
      name: speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 1  # 0 = Distance, 1 = RadiusOutlier
        max_range: 18.0
        max_range_difference: 0.1
        filter_window: 2