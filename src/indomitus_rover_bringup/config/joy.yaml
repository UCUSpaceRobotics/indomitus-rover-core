teleop_node:
  ros__parameters:
    publish_topic: /joy_raw_cmd_vel
    
    require_enable_button: false

    # Usually LB on Xbox-style controllers
    enable_button: 4

    # Usually RB on Xbox-style controllers
    enable_turbo_button: 5

    axis_linear:
      x: 1 # vertical axis of the left stick
    scale_linear:
      x: 1.0
    scale_linear_turbo:
      x: 1.5

    axis_angular:
      yaw: 0 # horizontal axis of the right stick
    scale_angular:
      yaw: 1.5
    scale_angular_turbo:
      yaw: 1.5