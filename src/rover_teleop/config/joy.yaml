joystick_interpreter:
  ros__parameters:
    axis_linear:
      x: 1 # Left stick vertical (forward/backward)
      y: 0 # Left stick horizontal (strafing left/right)
    scale_linear:
      x: 1.0
      y: 1.0

    # --- ANGULAR CONTROLS (Right Stick) ---
    axis_angular:
      yaw: 2 # Right stick horizontal (rotation clockwise/counterclockwise)
    scale_angular:
      yaw: 1.0

    # --- SPIN IN PLACE (L2 / R2) ---
    # Curvature mode only; inert in raw twist mode. Holding a trigger overrides
    # the left stick and commands a pure spin. Speed comes from L2 minus R2,
    # so pressing both cancels and a shared rest offset can't creep.
    axis_trigger:
      l2: 4   # positive difference -> counter-clockwise
      r2: 5
    trigger_deadzone: 0.15
    scale_rotate: 1.0        # rad/s at full trigger

    # Curvature 1/R at full right-stick deflection, in curvature mode.
    # 2.0 -> R = 0.5 m, which puts the turn centre inside the wheelbase.
    max_curvature: 2.0

    # Token speed used to steer the wheels while parked, in curvature mode with
    # the left stick centred. Must stay below the controller's park_speed
    # (0.001) so the drives stay at zero.
    angle_probe_speed: 0.00001

    # Which controller the motor toggle activates and where compact mode is
    # sent. swerve_controller_test is the experimental shape-smoothing
    # controller; it is spawned inactive, so pointing this at it is the
    # deliberate opt-in. Leave it on swerve_controller for normal driving.
    controller_name: swerve_controller


    # --- GRANNY MODE ---
    granny_speed_scale: 0.1
    granny_button: 0

    # --- VY (strafing) ---
    vy_enabled_default: false
    vy_toggle_button: 4   # Share button

    # --- MOTORS / COMPACT MODE ---
    motor_toggle_button: 6   # Options button
    compact_mode_button: 1

    active_toggle_button: 2
    active_default: true

    # --- TIMEOUT / PUBLISH RATE ---
    cmd_timeout: 0.2
    timeout_pub_rate: 20.0
    initial_timed_out: true
    cmd_pub_rate: 20.0

    # --- LIGHTS ---
    spotlight_button: 9   # L1
    beautiful_button: 10   # R1

    # --- TRAFFIC LIGHT ---
    traffic_red_button: 11      # ←
    traffic_yellow_button: 12   # →
    traffic_green_button: 13    # ↑
    traffic_blue_button: 14     # ↓
