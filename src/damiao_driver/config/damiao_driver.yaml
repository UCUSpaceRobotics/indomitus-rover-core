damiao_driver:
  ros__parameters:
    # ESC IDs [FL, FR, RL, RR] — must match motor register 8
    steer_ids: [1, 2, 3, 4]
    drive_ids: [5, 6, 7, 8]

    # Gear ratio: motor shaft / output shaft
    steer_gear_ratio: 40.0   # DM-J4340-2EC
    drive_gear_ratio: 10.0   # DM-J10010L-2EC

    # Damiao encoding ranges — must match motor registers 21/22/23
    steer_pmax: 12.5    # rad
    steer_vmax: 50.0    # rad/s
    steer_tmax: 10.0    # Nm
    drive_pmax: 12.5    # rad
    drive_vmax: 50.0    # rad/s
    drive_tmax: 20.0    # Nm

    # Maximum motor shaft speed during steer position moves (rad/s)
    steer_velocity_cap: 10.0

    # Feedback CAN ID — Damiao MST_ID register 7, default 0x000
    mst_id: 0

    # Joint names for /joint_states — must match URDF joint names [FL, FR, RL, RR]
    steer_joint_names:
      - fl_wheel_mount_joint
      - fr_wheel_mount_joint
      - bl_wheel_mount_joint
      - br_wheel_mount_joint
    drive_joint_names:
      - fl_wheel_joint
      - fr_wheel_joint
      - bl_wheel_joint
      - br_wheel_joint
