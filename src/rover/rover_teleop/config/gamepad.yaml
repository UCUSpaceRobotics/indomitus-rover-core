/**:
  ros__parameters:
    axis_linear:
      x: 1 # Left stick vertical (forward/backward)
      y: 0 # Left stick horizontal (strafing left/right)
    scale_linear:
      x: 1.0
      y: 1.0

    # --- ANGULAR CONTROLS (Right Stick) ---
    axis_angular:
      yaw: 2 # Right stick horizontal
    scale_angular:
      yaw: 1.0

    # Stick deadzone. Applied here, NOT in the joy driver as it has a bug
    deadzone: 0.05

    # --- SPIN IN PLACE (L2 / R2) ---
    # Curvature mode only
    axis_trigger:
      l2: 4   # positive difference -> counter-clockwise
      r2: 5
    trigger_deadzone: 0.15
    scale_rotate: 1.0        # rad/s at full trigger

    # Token yaw rate sent while both triggers are held but balanced, so the
    # wheels keep the spin-in-place shape instead of homing. rotation_scale
    # (~0.51 m) times this must stay below the controller's park_speed (0.001).
    rot_probe_wz: 0.00001

    # Curvature 1/R at full right-stick deflection, in curvature mode.
    # 2.0 -> R = 0.5 m, which puts the turn centre inside the wheelbase.
    max_curvature: 2.0

    # Token speed used to steer the wheels while parked. Must stay
    # below the controller's park_speed (0.001)
    angle_probe_speed: 0.00001

    # --- DRIVE MODE (local to this node: it only shapes our own twist) ---
    raw_twist_mode_button: 3

    # --- GRANNY MODE ---
    granny_speed_scale: 0.1
    granny_button: 0

    # --- VY (strafing) ---
    vy_enabled_default: false
    vy_toggle_button: 4   # Share button

    # --- DRIVE POWER / COMPACT MODE ---
    # Both are hardware state owned by drive_manager_node — these buttons only
    # ask it to invert what it holds, so the ground station can command the
    # same things from its switches without the two drifting apart.
    motor_toggle_button: 6   # Options button
    compact_mode_button: 1

    active_toggle_button: 2
    active_default: true

    # --- CLEAR MOTOR ERRORS ---
    # Sends the Damiao clear-error frame (FF..FB) to every drive motor.
    # Motors come back inhibited (magenta light bar) — cycle motor_toggle_button
    # to re-enable. On the D-pad, away from anything used while driving: this
    # is a recovery action and a stray press costs the operator a power cycle.
    clear_errors_button: 13   # ↑

    # --- DATASET ---
    # rover_cameras' dataset_node calls
    dataset_capture_button: -1
    dataset_record_button: -1

    # --- TIMEOUT / PUBLISH RATE ---
    cmd_timeout: 0.2
    timeout_pub_rate: 20.0
    initial_timed_out: true
    cmd_pub_rate: 20.0

    # Zero twists published when /joy goes stale, before this node goes quiet
    timeout_zero_burst: 3

    # --- LIGHTS ---
    spotlight_button: 9   # L1
    beautiful_button: 10  # R1
