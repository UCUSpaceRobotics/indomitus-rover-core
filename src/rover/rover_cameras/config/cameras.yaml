defaults:
  format: YUYV
  res: 960x600
  fps: 15
  quality: 60
  save_quality: 95
  jpeg_encoder: jpegenc
  ros_fps: 5
  ros_res: ''
  ros_encoding: rgb8
  save_dir: ~/dataset
  rotate_180: false   # true for a camera mounted upside down
  stereo: both        # side-by-side stereo camera: left or right sensor only, or both (joined)
  autostart: true     # false: only with include:=<name>, cameras:=<name> or cameras:=all

cameras:
  # Arducam B0495, YUYV only:
  #   USB 3.0: 1920x1200 @50/30/15, 960x600 @80/60/30/15
  #   USB 2.0: 960x600 @10 only
  arducam-mast:
    device: /dev/arducam-mast
    port: 8091   # http://10.42.0.1:8091/arducam-mast?action=stream

  arducam-front-bottom:
    device: /dev/arducam-front-bottom
    port: 8093   # http://10.42.0.1:8093/arducam-front-bottom?action=stream
    rotate_180: true

  # Arducam B0495, YUYV only:
  #   USB 3.0: 1920x1200 @50/30/15, 960x600 @80/60/30/15
  #   USB 2.0: 960x600 @10 only
  arm-camera:
    device: /dev/arm-camera
    port: 8095   # http://10.42.0.1:8095/arm-camera?action=stream

  # # MJPG: 640x480 .. 2592x1944 @30; YUYV: 640x480 @30, larger ones slower
  # arm-camera:
  #   device: /dev/arm-camera
  #   port: 8095   # http://10.42.0.1:8095/arm-camera?action=stream
  #   format: MJPG
  #   res: 640x480
  #   fps: 30
  #   quality: 30

  # MJPG: up to 1920x1080 @30, 1280x720 and smaller @60
  thermal-camera-front:
    device: /dev/thermal-camera
    port: 8097   # http://10.42.0.1:8097/thermal-camera-front?action=stream
    format: MJPG
    res: 640x480
    fps: 10
    quality: 40

  # ZED 2i as a plain UVC camera, YUYV only, both sensors side by side in one
  # frame: 4416x1242 @15, 3840x1080 @30/15, 2560x720 @60/30/15, 1344x376 @100/60/30/15.
  # `res` is the joined size; `stereo: left|right` halves the width after capture.
  # Excludes rover_sensors/zed2i.launch.py (the ZED SDK opens the same device),
  # so it starts only when asked for: include:=zed2i (with the others) or cameras:=zed2i.
  zed2i:
    autostart: false
    device: /dev/zed2i-stereo-camera
    port: 8098   # http://10.42.0.1:8098/zed2i?action=stream
    res: 2560x720
    fps: 15
    stereo: left