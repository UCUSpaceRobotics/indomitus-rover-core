# Combined controller_manager configuration for the rover+arm sim
# (rover_sim/launch/sim_gz_full.launch.py). One gz_ros2_control-system
# plugin (added by rover.xacro when use_sim:=true) loads every
# <ros2_control> block declared anywhere in the combined URDF -- both the
# rover's (rover.ros2_control.xacro) and the mounted arm's (arm_macro.xacro,
# mount_arm:=true) -- so a single controller_manager here has to list every
# controller from both rover_sim/config/controllers.yaml and
# arm_sim/config/ros2_controllers.yaml. Keep these three files in sync by
# hand until someone automates the merge.
/**/controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    swerve_controller:
      type: rover_controller/RoverSwerveController

    odometry_controller:
      type: rover_controller/RoverOdometryController

    diff_bar_effort_controller:
      type: rover_sim/RockerDiffController

    indomitus_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_right_controller:
      type: position_controllers/JointGroupPositionController

    gripper_left_controller:
      type: position_controllers/JointGroupPositionController

/**/swerve_controller:
  ros__parameters:
    drive_joint_names:
      - fl_wheel_joint
      - fr_wheel_joint
      - bl_wheel_joint
      - br_wheel_joint
    steer_joint_names:
      - fl_wheel_mount_joint
      - fr_wheel_mount_joint
      - bl_wheel_mount_joint
      - br_wheel_mount_joint

    max_linear_speed:  1.0
    max_accel:         0.6
    max_decel:         1.2
    max_jerk:          2.0
    max_decel_jerk:    6.0
    cmd_vel_timeout_s: 0.5

    # 135 to match the real rover. Spin-in-place
    # works either way -- it wants ~129 deg, but from a neutral start the IK
    # picks the equivalent -51 deg with reversed wheel speed, which fits in 90
    # too. The limit only changes the answer when a wheel is already parked
    # near the far side, so matching hardware keeps those cases honest.
    # The URDF allows +-270, so 135 is within joint range.
    max_steer_deg: 135.0
    max_steer_rate_deg: 90.0

    # The steering joints' own travel, from the URDF. max_steer_deg restricts
    # the kinematic angle; compact mode folds ±180° on top of that, and the sum
    # is what the joint actually sees. Checked and clamped by the controller.
    max_joint_angle_deg: 270.0

    max_theta_rate_rad: 1.5708   # pi/2
    # 0.74, not the 1.0 used on hardware: same 2.10 gain from phi to wheel
    # angle, but sim's max_steer_rate_deg is 90 (1.571 rad/s), so 1.571/2.10.
    max_phi_rate_rad:   0.74
    rotation_scale_length: 0.0   # auto = wheel half-diagonal
    park_speed: 0.001

    # Measured standstill — snapping the shape and homing the wheels both wait
    # on it, so that neither can happen while the rover is still rolling.
    standstill_speed: 0.02
    standstill_hold_s: 0.2

    idle_home_delay: 0.5         # negative disables return-to-zero

    # Explicit, not the code defaults (0.797 / 0.644 / 0.156): must match
    # odometry_controller below.
    wheelbase:    0.797
    track_width:  0.644
    wheel_radius: 0.156

/**/odometry_controller:
  ros__parameters:
    wheelbase: 0.797
    track_width: 0.644
    wheel_radius: 0.156
    steer_joint_names:
      - fl_wheel_mount_joint
      - fr_wheel_mount_joint
      - bl_wheel_mount_joint
      - br_wheel_mount_joint
    drive_joint_names:
      - fl_wheel_joint
      - fr_wheel_joint
      - bl_wheel_joint
      - br_wheel_joint

/**/diff_bar_effort_controller:
  ros__parameters:
    k_stiffness: 2000.0
    d_damping: 10.0
    effort_limit: 150.0

/**/indomitus_arm_controller:
  ros__parameters:
    joints:
      - arm_mount_base_joint
      - arm_base_shoulder_joint
      - arm_shoulder_forearm_joint
      - arm_forearm_wrist_1_joint
      - arm_wrist_1_wrist_2_joint
      - arm_wrist_2_end_effector_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

/**/gripper_right_controller:
  ros__parameters:
    joints:
      - arm_jaw_gripper_finger_right_joint
    interface_name: position

/**/gripper_left_controller:
  ros__parameters:
    joints:
      - arm_jaw_gripper_finger_left_joint
    interface_name: position
