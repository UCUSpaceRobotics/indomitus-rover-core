# Subsystem "core": runs in tmux session "core" in rover_prod (rover-launch@core.service).
# COMMAND gets the mission's extra launch args appended. CAN_IFACE: wait until UP (empty: don't).
COMMAND=ros2 launch rover_bringup rover.launch.py
CAN_IFACE=can_rover   # rover.launch.py's default interface:=can_rover - keep in sync
