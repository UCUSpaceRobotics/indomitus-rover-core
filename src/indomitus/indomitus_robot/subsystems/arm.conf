# Subsystem "arm": runs in tmux session "arm" in rover_prod (rover-launch@arm.service).
# COMMAND gets the mission's extra launch args appended. CAN_IFACE: wait until UP (empty: don't).
COMMAND=ros2 launch arm_bringup arm.launch.py use_fake_hardware:=false
CAN_IFACE=can0        # arm_macro.xacro's default can_interface (arm.launch.py passes none) - keep in sync
