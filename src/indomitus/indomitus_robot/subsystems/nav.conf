# Subsystem "nav": runs in tmux session "nav" in rover_prod (rover-launch@nav.service).
# COMMAND gets the mission's extra launch args appended. CAN_IFACE: wait until UP (empty: don't).
COMMAND=ros2 launch rover_bringup navigation.launch.py
CAN_IFACE=            # none: navigation.launch.py itself waits for the LiDAR / ZED topics
