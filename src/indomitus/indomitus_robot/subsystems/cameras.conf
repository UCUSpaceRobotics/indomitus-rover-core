# Subsystem "cameras": runs in tmux session "cameras" in rover_prod (rover-launch@cameras.service).
# COMMAND gets the mission's extra launch args appended. CAN_IFACE: wait until UP (empty: don't).
COMMAND=ros2 launch rover_bringup cameras.launch.py
CAN_IFACE=            # none: camera nodes respawn until their /dev/<camera> shows up
