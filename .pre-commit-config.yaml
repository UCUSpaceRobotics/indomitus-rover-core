# .pre-commit-config.yaml
repos:
  # General hooks for YAML, XML, and basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace     # Auto-removes trailing whitespace
      - id: end-of-file-fixer       # Auto-ensures files end with a newline
      - id: check-yaml              # Lints YAML syntax
      - id: check-xml               # Lints XML syntax (for package.xml, launch files)
      - id: check-added-large-files # Prevents accidentally committing huge binaries

  # Python: Auto-formatting (Safe/Non-breaking)
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        args: [--line-length=100]   # ROS 2 standard line length

  # Python: Linting (Prints issues like unused variables, bad imports)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=100, --extend-ignore=E203]

  # C++: Auto-formatting (Requires a .clang-format file in your repo)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # C++: Linting (Prints style/syntax issues)
  - repo: https://github.com/cpplint/cpplint
    rev: 1.6.1
    hooks:
      - id: cpplint
