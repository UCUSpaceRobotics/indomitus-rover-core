name: Publish Production And Development Images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docker/**'
      - 'src/**'
      - '.github/workflows/publish_image.yaml'
  workflow_dispatch: 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push-multiarch:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: lowercase-repo
        run: |
          REPO="${{ github.repository }}"
          echo "name=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata for PROD image
        id: metadata-tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase-repo.outputs.name }}
          flavor: |
            suffix=-prod
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
          labels: |
            org.opencontainers.image.description=Production Image (ARM64) for Indomitus Rover

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push PROD Image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: prod 
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata-tags.outputs.tags }}
          labels: ${{ steps.metadata-tags.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}-prod
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-prod
      
      - name: Extract Docker metadata for DEV image
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase-repo.outputs.name }}
          flavor: |
            suffix=-dev
          tags: |
            type=ref,event=branch
          labels: |
            org.opencontainers.image.description=Development Image (AMD64) for Indomitus Rover with Simulation Tools

      - name: Build and Push DEV Image (AMD64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          platforms: linux/amd64
          push: true
          build-args: |
            INSTALL_SIM_TOOLS=true
          tags: ${{ steps.meta-dev.outputs.tags }}
          cache-from: type=gha,scope=${{ github.ref_name }}-dev
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-dev