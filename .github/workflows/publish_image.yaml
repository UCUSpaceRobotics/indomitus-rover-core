name: Publish Production And Development Images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docker/**'
      - 'src/**'
      - '.github/workflows/publish_image.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Bumps and pushes a version tag for this exact commit before anything is
  # built, so the build jobs below can tag the one image they produce with it
  # directly — no separate rebuild, no re-tagging step, no risk of the
  # versioned tag drifting from the branch tag it was built alongside.
  #
  # main gets a real release (minor bump, no pre-release marker); develop gets
  # a pre-release train off the last real release (patch bump once, then a
  # `-dev.N` counter per commit) — see the note in the release job below on
  # why a plain patch bump on develop isn't used instead.
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
          DEFAULT_BUMP: ${{ github.ref == 'refs/heads/main' && 'minor' || 'patch' }}
          PRERELEASE: ${{ github.ref == 'refs/heads/develop' }}
          PRERELEASE_SUFFIX: dev

  build-and-push-prod-arm64:
    needs: tag
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Lowercase Repository Name
        id: lowercase-repo
        run: |
          REPO="${{ github.repository }}"
          echo "name=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata for PROD image
        id: metadata-tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase-repo.outputs.name }}
          flavor: |
            suffix=-prod
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=raw,value=${{ needs.tag.outputs.new_tag }}
          labels: |
            org.opencontainers.image.description=Production Image (ARM64) for Indomitus Rover

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push PROD Image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=ros:humble-ros-base
          tags: ${{ steps.metadata-tags.outputs.tags }}
          labels: ${{ steps.metadata-tags.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lowercase-repo.outputs.name }}-cache:prod-arm64
          cache-to: type=registry,mode=min,ref=${{ env.REGISTRY }}/${{ steps.lowercase-repo.outputs.name }}-cache:prod-arm64

  build-and-push-dev-amd64:
    needs: tag
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Lowercase Repository Name
        id: lowercase-repo
        run: |
          REPO="${{ github.repository }}"
          echo "name=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata for DEV image
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase-repo.outputs.name }}
          flavor: |
            suffix=-dev
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ needs.tag.outputs.new_tag }}
          labels: |
            org.opencontainers.image.description=Development Image (AMD64) for Indomitus Rover with Simulation Tools

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push DEV Image (AMD64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          platforms: linux/amd64
          push: true
          build-args: |
            INSTALL_SIM_TOOLS=true
            BASE_IMAGE=ros:humble-ros-base
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.lowercase-repo.outputs.name }}-cache:dev-amd64
          cache-to: type=registry,mode=min,ref=${{ env.REGISTRY }}/${{ steps.lowercase-repo.outputs.name }}-cache:dev-amd64

  # Body is package links only, on purpose — no auto-generated changelog text.
  release:
    needs: [tag, build-and-push-prod-arm64, build-and-push-dev-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Lowercase Repository Name
        id: lowercase-repo
        run: |
          REPO="${{ github.repository }}"
          echo "name=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ github.ref == 'refs/heads/main' && format('Release {0}', needs.tag.outputs.new_tag) || format('Develop build {0}', needs.tag.outputs.new_tag) }}
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
          generate_release_notes: false
          body: |
            [ghcr.io/${{ steps.lowercase-repo.outputs.name }}:${{ needs.tag.outputs.new_tag }}-prod](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})
            [ghcr.io/${{ steps.lowercase-repo.outputs.name }}:${{ needs.tag.outputs.new_tag }}-dev](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})
