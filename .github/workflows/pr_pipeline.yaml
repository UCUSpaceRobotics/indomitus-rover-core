name: PR Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ROS_DISTRO: humble
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    runs-on: ubuntu-22.04
    outputs:
      docker_changed: ${{ steps.filter.outputs.docker }}
      dependencies_changed: ${{ steps.filter.outputs.dependencies }}
      image_tag: ${{ steps.set-tag.outputs.tag }}
      image_name: ${{ steps.lowercase-repo.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name for GHCR
        id: lowercase-repo
        run: |
          REPO="${{ github.repository }}"
          echo "name=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Check for Dockerfile changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/**'
            dependencies:
              - 'src/**/package.xml'

      - name: Determine Image Tag
        id: set-tag
        run: |
          if [ "${{ steps.filter.outputs.docker }}" == "true" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.base_ref }}-dev" >> $GITHUB_OUTPUT
          fi

  build-temp-image:
    needs: detect-changes
    if: needs.detect-changes.outputs.docker_changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push PR Image (DEV Target)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          platforms: linux/amd64
          push: true
          build-args: |
            INSTALL_SIM_TOOLS=true
          tags: ${{ env.REGISTRY }}/${{ needs.detect-changes.outputs.image_name }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-tests:
      needs: [detect-changes, build-temp-image]
      if: always() && !cancelled() && !contains(needs.*.result, 'failure')
      runs-on: ubuntu-22.04
      permissions:
        contents: read
        checks: write
        pull-requests: write
        packages: read

      container:
        image: ghcr.io/${{ needs.detect-changes.outputs.image_name }}:${{ needs.detect-changes.outputs.image_tag }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      env:
        ROS_DISTRO: humble

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install missing dependencies via rosdep
          if: needs.detect-changes.outputs.dependencies_changed == 'true' && needs.detect-changes.outputs.docker_changed == 'false'
          shell: bash
          run: |
            source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
            apt-get update -q
            rosdep update
            rosdep install --from-paths src --ignore-src --rosdistro ${{ env.ROS_DISTRO }} -r -y

        - name: Cache ROS 2 Workspace
          uses: actions/cache@v4
          with:
            path: |
              build
              install
            key: ros2-build-${{ github.base_ref }}-${{ hashFiles('**/package.xml', '**/CMakeLists.txt') }}
            restore-keys: |
              ros2-build-${{ github.base_ref }}-

        - name: Build ROS 2 Workspace
          shell: bash
          run: |
            source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
            colcon build --symlink-install --event-handlers console_cohesion+

        # - name: Code Style & Documentation Warnings
        #   continue-on-error: true
        #   shell: bash
        #   run: |
        #     source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
        #     ament_flake8 src/
        #     ament_pep257 src/
        #     ament_cpplint src/

        - name: Run Functional Unit Tests
          shell: bash
          run: |
            source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
            source install/setup.bash            
            
            # Run test with disabled linters for both Python (pytest) AND C++ (CTest)
            colcon test --event-handlers console_cohesion+ \
              --pytest-args -m "not linter" \
              --ctest-args -LE linter

        - name: Fix Git Ownership
          if: always()
          run: git config --global --add safe.directory '*'

        - name: Publish Test Report Dashboard
          uses: dorny/test-reporter@v1
          if: success() || failure() 
          with:
            name: ROS 2 Unit Test Results
            path: 'build/**/test_results/**/*.xml,build/**/pytest.xml'
            reporter: java-junit 

        - name: Evaluate Results & Block Merge
          if: success() || failure()
          shell: bash
          run: |
            source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
            colcon test-result --all