name: Build

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ROS_DISTRO: humble
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}
      - name: Install dependencies
        shell: bash
        run: |
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          sudo apt update
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro ${{ env.ROS_DISTRO }} -r -y

      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          colcon build