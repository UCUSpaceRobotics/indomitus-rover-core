name: Tag pre-release on develop

# Gives every develop commit its own version instead of leaving the patch
# number permanently at 0: main bumps major/minor for real releases, develop
# bumps a pre-release identifier (1.3.0-dev.7) per commit, so a develop build
# is always individually addressable without spending a real patch number on
# something that isn't a fix release.

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push pre-release tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: false
          PRERELEASE: true
          PRERELEASE_SUFFIX: dev

  build-images:
    needs: tag
    uses: ./.github/workflows/publish_release_image.yaml
    with:
      version: ${{ needs.tag.outputs.new_tag }}

  release:
    needs: [tag, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Lowercase Repository Name
        id: lowercase-repo
        run: |
          REPO="${{ github.repository }}"
          echo "name=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: "Develop build ${{ needs.tag.outputs.new_tag }}"
          prerelease: true
          generate_release_notes: false
          body: |
            [ghcr.io/${{ steps.lowercase-repo.outputs.name }}:${{ needs.tag.outputs.new_tag }}-prod](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})
            [ghcr.io/${{ steps.lowercase-repo.outputs.name }}:${{ needs.tag.outputs.new_tag }}-dev](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})
