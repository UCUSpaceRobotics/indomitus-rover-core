services:
  rover_dev:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ros:humble-ros-base}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        TARGET_ROS_DISTRO: ${TARGET_ROS_DISTRO:-humble}
        INSTALL_SIM_TOOLS: "false"

    image: ${IMAGE_NAME:-ghcr.io/ucuspacerobotics/indomitus-rover-core}:${IMAGE_TAG:-local-dev}
    container_name: rover_dev
    command: tail -f /dev/null # command: autolaunch
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    device_cgroup_rules:
      - "c 13:* rmw"
      # - 'c 81:* rmw' # FOR aruco_debug.launch.py
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/$$TARGET_ROS_DISTRO/setup.bash && ros2 pkg list > /dev/null'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - SDL_VIDEODRIVER=dummy
      - SDL_AUDIODRIVER=dummy
    volumes:
      - ./:/work:rw
      - ./src:/opt/ws/src:rw
      - /dev:/dev:rw
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /usr/local/zed/settings/:/usr/local/zed/settings/:rw
      - /usr/local/zed/resources/:/usr/local/zed/resources/:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]