# Size each window to the client that used it last, not to the smallest one
# attached - otherwise one phone-sized terminal shrinks everyone's view.
set -g window-size latest
setw -g aggressive-resize on

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g default-terminal "tmux-256color"
# Sessions created by systemd (docker exec, no SHELL set) still get bash with
# ROS sourced from .bashrc.
set -g default-shell /bin/bash

# Windows are named after subsystems (core, arm, cameras...): keep the names.
setw -g automatic-rename off
set -g allow-rename off
set -g renumber-windows on

set -g status-left-length 30
set -g status-left "#[bold] #{session_name} #[default]| "
set -g status-right "#{?client_readonly,[read-only] ,}#(hostname) %H:%M "
setw -g window-status-current-style "bold,reverse"

# Reload after editing: C-b r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
