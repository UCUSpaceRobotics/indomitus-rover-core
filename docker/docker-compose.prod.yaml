services:
  rover_prod:
    image: ${IMAGE_NAME:-ghcr.io/ucuspacerobotics/indomitus-rover-core}:${IMAGE_TAG:-develop-prod}
    container_name: rover_prod
    runtime: nvidia
    command: tail -f /dev/null # command: autolaunch
    network_mode: host
    privileged: true
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    device_cgroup_rules:
      - "c 13:* rmw"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "pgrep", "-f", "ros2"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      - CAN_INTERFACE=can0
      - SDL_VIDEODRIVER=dummy
      - SDL_AUDIODRIVER=dummy
    volumes:
      - /home/indomitus-rover/indomitus-rover-core/src:/opt/ws/src:rw