services:
  indomitus_rover_prod:
    image: indomitus-rover:humble-prod
    container_name: indomitus_rover_prod
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      - CAN_INTERFACE=can0
      - CAN_BITRATE=1000000
    volumes:
    - /home/ros/Indomitus/indomitus-rover-core/src:/opt/ws/src:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
