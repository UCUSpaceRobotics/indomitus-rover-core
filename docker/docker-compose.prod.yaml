# indomitus-rover-core-ai on the Jetson: lives in ~/indomitus-rover-core-ai next to the
# team's ~/indomitus-rover-core and runs as its own container (rover_ai), from this
# fork's CI image (ROS 2 Jazzy). IMAGE_NAME / IMAGE_TAG come from the .env file
# next to this compose file, written by scripts/deploy_to_rover.sh.
#
# rover_prod and rover_ai can both exist, but run nodes in only one of them at a
# time: both use host networking, the same ROS_DOMAIN_ID and the same CAN buses.
services:
  rover_ai:
    platform: linux/arm64
    runtime: nvidia
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ros:jazzy-ros-base}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
        TARGET_ROS_DISTRO: ${TARGET_ROS_DISTRO:-jazzy}

    image: ${IMAGE_NAME:-ghcr.io/yuriifito/indomitus-rover-core-ai}:${IMAGE_TAG:-develop-prod}
    pull_policy: never
    container_name: rover_ai
    command: tail -f /dev/null # command: autolaunch
    network_mode: host
    privileged: true
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    device_cgroup_rules:
      - "c 13:* rmw"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/$$TARGET_ROS_DISTRO/setup.bash && ros2 pkg list > /dev/null'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-90}
      - ROS_LOCALHOST_ONLY=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - SDL_VIDEODRIVER=dummy
      - SDL_AUDIODRIVER=dummy
    volumes:
      # Relative to this compose file, i.e. the project directory on the Jetson.
      - ./src:/opt/ws/src:rw
      # Build output on the host: survives container re-creation, and hides the
      # image's own build/ (made from the team's source tree, whose CMake caches
      # point at different package paths).
      - ./build:/opt/ws/build:rw
      - ./install:/opt/ws/install:rw
      - ./log:/opt/ws/log:rw
      - /dev:/dev:rw
      - /run/udev:/run/udev:ro
      # - /usr/local/zed/settings/:/usr/local/zed/settings/:rw
      # - /usr/local/zed/resources/:/usr/local/zed/resources/:rw