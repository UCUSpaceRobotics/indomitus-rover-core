services:
  rover_prod:
    image: ${IMAGE_NAME:-ghcr.io/ucuspacerobotics/indomitus-rover-core}:${IMAGE_TAG:-develop-prod}
    container_name: rover_prod
    runtime: nvidia
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      - CAN_INTERFACE=can0
      - CAN_BITRATE=1000000
      - CAN_TRANSMIT_QUEUE_SIZE=1000
    volumes:
      - /home/indomitus-rover/indomitus-rover-core/src:/opt/ws/src:rw
      - /dev:/dev/:rw