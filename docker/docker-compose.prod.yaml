services:
  rover_prod:
    platform: linux/arm64
    runtime: nvidia
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
      args:
        BASE_IMAGE_HW_BUILDER: ${BASE_IMAGE_HW_BUILDER:-dustynv/onnxruntime:1.22-r36.4.0-cu128-24.04}
        BASE_IMAGE: ${BASE_IMAGE:-dustynv/onnxruntime:1.22-r36.4.0-cu128-24.04}
        ZED_SDK_URL: ${ZED_SDK_URL:-https://download.stereolabs.com/zedsdk/5.4/l4t36.4/jetsons}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
        TARGET_ROS_DISTRO: ${TARGET_ROS_DISTRO:-jazzy}

    image: ${IMAGE_NAME:-ghcr.io/yuriifito/indomitus-rover-core-ai}:${IMAGE_TAG:-local-prod}
    pull_policy: never
    container_name: rover_prod
    command: tail -f /dev/null # command: autolaunch
    network_mode: host
    privileged: true
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    device_cgroup_rules:
      - "c 13:* rmw"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/$$TARGET_ROS_DISTRO/setup.bash && ros2 pkg list > /dev/null'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-90}
      - ROS_LOCALHOST_ONLY=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - SDL_VIDEODRIVER=dummy
      - SDL_AUDIODRIVER=dummy
    volumes:
      - /home/indomitus-rover/indomitus-rover-core/src:/opt/ws/src:rw
      - /dev:/dev:rw
      - /run/udev:/run/udev:ro
      - /home/indomitus-rover/bags:/bags:rw
      - /usr/local/zed/settings/:/usr/local/zed/settings/:rw
      - /usr/local/zed/resources/:/usr/local/zed/resources/:rw