# Runs this repo's container ON THE GROUND STATION laptop, not on the rover.
#
# Why it exists: the GS reaches the rover through the mast Pi, which is an L3
# router, and multicast SPDP does not cross a router. Without the Fast DDS
# profile below a container here sees nothing — or worse, sees a stale graph
# from the ros2 daemon while every service call hangs waiting for a peer that
# was never really discovered.
#
# What it is for: the ros2 CLI tools that live in this image and not in the
# ground-station one — `ros2 control`, `ros2 lifecycle`, controller_manager_msgs
# — pointed at the real rover. It launches nothing.
#
# A per-device template, like docker-compose.prod.yaml beside it. On a ground
# station laptop copy it to the repo root as docker-compose.yaml, which is
# gitignored, and plain compose commands then do the right thing:
#
#   cp docker/docker-compose.gs.yaml docker-compose.yaml
#   docker compose up -d
#   docker compose exec rover_gs bash
#   ros2 control set_hardware_component_state RoverHardware active
#
# Paths below are relative to the repo root, which is what makes that copy
# work. Running the template in place needs --project-directory instead, or
# compose resolves them against docker/, mounts the wrong tree at /work and
# leaves the DDS profile unfindable:
#
#   docker compose -f docker/docker-compose.gs.yaml --project-directory . up -d

# Its own compose project. Without this the project name comes from the
# directory, which is the same one the root docker-compose.yaml uses, and then
# `docker compose up` on either file treats the other's container as an orphan
# and removes it.
name: indomitus-rover-gs

services:
  rover_gs:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        BASE_IMAGE_HW_BUILDER: ${BASE_IMAGE_HW_BUILDER:-stereolabs/zed:5.4-devel-cuda12.8-ubuntu22.04}
        BASE_IMAGE: ${BASE_IMAGE:-stereolabs/zed:5.4-runtime-cuda12.8-ubuntu22.04}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        TARGET_ROS_DISTRO: ${TARGET_ROS_DISTRO:-humble}
        INSTALL_SIM_TOOLS: "false"

    image: ${IMAGE_NAME:-ghcr.io/ucuspacerobotics/indomitus-rover-core}:${IMAGE_TAG:-local-dev}
    # Deliberately not rover_dev: on the GS laptop this coexists with a dev
    # container, and two of them fighting over one name is a confusing failure.
    container_name: rover_gs
    # A missing profile does not stop Fast DDS - it falls back to multicast,
    # which cannot reach a rover behind the mast Pi, and every symptom then
    # points at the network. Check it here instead, while the cause is obvious.
    command: >
      bash -c 'test -f "$$FASTRTPS_DEFAULT_PROFILES_FILE" || {
      echo "error: no DDS profile at $$FASTRTPS_DEFAULT_PROFILES_FILE" >&2;
      echo "       start the ground-station container once to generate it, or set GS_REPO" >&2;
      exit 1; }; exec tail -f /dev/null'
    network_mode: host
    # The profile whitelists a host interface, so the container has to see the
    # host's real interfaces. Host IPC puts this container and the ground
    # station's on one /dev/shm, without which they discover each other and
    # then exchange no data.
    ipc: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true

    environment:
      # Must match the rover.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-90}
      - ROS_LOCALHOST_ONLY=0
      # The profile is Fast DDS-specific and silently ignored under Cyclone.
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Whitelists the mast-link interface and adds unicast discovery peers for
      # the rover. Not a file in this repo on purpose: it names one machine's
      # link address and is regenerated on every ground-station container start,
      # so a copy here would rot silently. Mounted from the GS checkout below.
      - FASTRTPS_DEFAULT_PROFILES_FILE=${FASTDDS_PROFILE:-/opt/dds/fastdds_rover_link.xml}
      - SDL_VIDEODRIVER=dummy
      - SDL_AUDIODRIVER=dummy

    volumes:
      # The generated Fast DDS profile lives in the ground-station checkout,
      # which is the only thing that knows how to produce it. Point GS_REPO
      # elsewhere if yours is not a sibling of this one.
      - ${GS_REPO:-../indomitus-ground-station}/docker:/opt/dds:ro
      - ./:/work:rw
      - ./src:/opt/ws/src:rw
      - /dev:/dev:rw
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/$$TARGET_ROS_DISTRO/setup.bash && ros2 pkg list > /dev/null'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
